# DFM4 mix: DFM3 plus paragraph reordering and summarization objectives.
#
# New DFM4 target additions are approximately 2.8B covered tokens/epoch per
# family where enough unique data exists:
# - Danish DynaWord paragraph reordering
# - Common Pile paragraph reordering
# - arXiv paper-to-abstract summarization
# - GovReport summarization: reduced target, about 0.1B exposure tokens/epoch
# - WikiCatSum / Wikipedia-derived summarization: reduced target, about 0.45B
#   exposure tokens/epoch
# - LAION Scientific-Summaries structured scientific summarization: larger
#   target to absorb the remaining summarization budget
#
# GovReport and WikiCatSum are small enough that repeats may be needed to hit
# exposure volume; inspect data/show_analytics_dfm4.md for unique-vs-repeated
# coverage before treating the budget as final.

# DFM4 paragraph reordering.
- prefix: "dfm4_dynaword_paragraph_reorder__"
  max_per_file: 120_000
- prefix: "dfm4_common_pile_paragraph_reorder__"
  max_per_file: 6_000

# DFM4 summarization.
- prefix: "dfm4_arxiv_paper_summarization__"
  max_per_file: 100_000
- prefix: "dfm4_govreport_summarization__"
  repeat: 2
- prefix: "dfm4_wiki_cat_sum_summarization__"
  repeat: 2
- prefix: "dfm4_laion_scientific_summaries__"
  max_per_file: 3_000

