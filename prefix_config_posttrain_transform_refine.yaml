# Post-training transformation/refinement mix.
#
# This config assumes tokenized_path points at data/tokenized_posttrain_transform_refine,
# which is already a filtered union of only relevant tasks. The goals are:
# - make controlled editing/transformation data visible enough to affect final CPs;
# - retain nearby high-quality instruction-following and summarization data;
# - keep synthetic data separate and easy to include/exclude.

# New curated transformation sources.
- prefix: "posttrain_coedit__"
  repeat: 8
- prefix: "posttrain_superni_filtered__"
  max_per_file: 500_000
  repeat: 2

# Synthetic teacher-generated transformation sources. Generated files are
# accepted/validated before conversion, then sampled with substantial repeats
# because the generated corpus starts small relative to the pretraining mix.
- prefix: "posttrain_synthetic_exact_sentence_summary_en__"
  repeat: 20
- prefix: "posttrain_synthetic_exact_sentence_summary_da__"
  repeat: 20
- prefix: "posttrain_synthetic_past_tense_rewrite_en__"
  repeat: 20
- prefix: "posttrain_synthetic_past_tense_rewrite_da__"
  repeat: 20
- prefix: "posttrain_synthetic_child_friendly_simplification_en__"
  repeat: 20
- prefix: "posttrain_synthetic_child_friendly_simplification_da__"
  repeat: 20
- prefix: "posttrain_synthetic_numbered_fact_extraction_en__"
  repeat: 20
- prefix: "posttrain_synthetic_numbered_fact_extraction_da__"
  repeat: 20
- prefix: "posttrain_synthetic_non_copy_rewrite_en__"
  repeat: 20
- prefix: "posttrain_synthetic_non_copy_rewrite_da__"
  repeat: 20

# Existing relevant summarization/transformation-adjacent data.
- prefix: "dfm4_arxiv_paper_summarization__"
  max_per_file: 100_000
  repeat: 2
- prefix: "dfm4_govreport_summarization__"
  repeat: 6
- prefix: "dfm4_wiki_cat_sum_summarization__"
  repeat: 6
- prefix: "dfm4_laion_scientific_summaries__"
  max_per_file: 3_000
  repeat: 3

# Danish writing, summary, article, and QA/instruction sources.
- prefix: "dbc__dbc-abstracts_"
