# DFM11 sampling policy.
#
# DFM11 inherits the complete DFM10 policy, replaces selected malformed tool
# families, and adds audited Koolbardi and Mathagentic sources.
# Held-out validation/test rows are never tokenized for training.
#
# DFM11 additions use their validated source reservoirs. Replaced DFM10 tool
# prefixes are removed by scripts/build_tokenized_dfm11_tree.py.

- prefix: dfm11-koolbardi-da__
  repeat: 1
- prefix: dfm11-koolbardi-en__
  repeat: 1

# English grounded FineInstructions: all controlled chats plus a deterministic
# source-balanced 100K legacy-chat staging selection. Pair rows are published
# but not tokenized separately because each selected chat starts with its pair.
- prefix: dfm11-fineinstructions-en-controlled__
  repeat: 1
- prefix: dfm11-fineinstructions-en-legacy-balanced__
  repeat: 1

# Four equal-ish source shards; 12,500 per file gives the approved 50K cap.
- prefix: dfm11-mathagentic-tinygsm-python__
  max_per_file: 12500
  repeat: 1
- prefix: dfm11-mathagentic-gsm8k-prolog__
  repeat: 2

- prefix: dfm11-glaive-native-tool-use-repaired__
  repeat: 1
- prefix: dfm11-toolace-native-tool-use-repaired__
  repeat: 1
- prefix: dfm11-nemotron-agentic-tool-calling-repaired__
  repeat: 1
- prefix: dfm11-synthetic-native-tool-calling-repaired__
  repeat: 4

# DFM10 baseline follows unchanged.

- prefix: andersen_modernization__
  repeat: 20

# Alexandra Institute train-only additions. The original Nordjylland summaries
