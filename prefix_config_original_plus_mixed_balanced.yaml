# Ordered: First match applies.
#
# Balanced config for the original ∪ mixed dataset.
# Goal: keep the original Sapient sampling policy intact while preventing
# the added mixed sources from dominating each epoch.

# Large mixed additions
- prefix: "nemotron_multilingual__"
  max_per_file: 50_000
- prefix: "danish_dynaword__"
  max_per_file: 50_000
- prefix: "oliverkinch_machine_translation_da_en__"
  max_per_file: 3_000_000
- prefix: "oliverkinch_machine_translation_da_ar__"
  max_per_file: 1_000_000
- prefix: "oliverkinch_machine_translation_da_uk__"
  max_per_file: 1_000_000
- prefix: "nemotron_instruction_reasoning_off__"
  max_per_file: 250_000
- prefix: "allenai_big_reasoning_traces__"
  max_per_file: 5_000
- prefix: "dolci_instruct_sft_tool_use_sa__"
  max_per_file: 50_000
- prefix: "dolci_instruct_sft_tool_use__"
  max_per_file: 50_000
- prefix: "dolci_instruct_sft_no_tools__"
  max_per_file: 50_000
- prefix: "dolci_instruct_sft__"
  max_per_file: 50_000
- prefix: "nemotron_agentic__"
  max_per_file: 100_000
- prefix: "nemotron_swe__"
