- prefix: "allenai_tulu_v2_sft_mixture__"
  max_per_file: 100_000
- prefix: "allenai_tulu_3_sft_mixture__"
  max_per_file: 50_000
- prefix: "allenai_tulu_3_personas_math__"
  max_per_file: 50_000

# Local DBC additions
- prefix: "dbc__dbc-abstracts_"
