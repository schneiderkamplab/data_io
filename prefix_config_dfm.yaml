# DFM mix: safe filtered Sapient + approved Danish/English additions.
#
# Target: about 28B tokens per epoch, comparable to 2x the original Sapient
# per-epoch budget. Ordered: first match applies.
#
# This config is intended for data/tokenized_mixed, where filtered Sapient
# sources are source-prefixed as sapient_cleaned__...

# Local Danish instruction/reference additions.
- prefix: "dbc__dbc-abstracts_"
  max_per_file: 100_000
- prefix: "dbc__dbc-reviews"
  max_per_file: 150_000
- prefix: "dbc__dbc-faktalink"
  repeat: 20
- prefix: "dbc__dbc-farfatterweb"
  repeat: 20
- prefix: "lexdk__"
  repeat: 10

# Danish continuation / translation-like data, capped so it does not dominate.
- prefix: "danish_dynaword__"
  max_per_file: 60_000
- prefix: "opus__"
  max_per_file: 200_000
- prefix: "oliverkinch_machine_translation_da_en__"
  max_per_file: 3_000_000
- prefix: "oliverkinch_machine_translation_da_uk__"
  max_per_file: 1_000_000
- prefix: "oliverkinch_machine_translation_da_ar__"
  max_per_file: 1_000_000
- prefix: "synquid_translation_100k__"
  repeat: 1

# Gated Danish instruction sources now intended for DFM.
- prefix: "laerebogen_with_followups__"
  repeat: 2
- prefix: "synquid_wiki_instruct_da__"
  repeat: 2
- prefix: "oliverkinch_instruct_bt__"
  repeat: 5
- prefix: "synquid_mt_da_deepseek__"
  max_per_file: 100_000
- prefix: "synquid_wildchat_100k_qwen_messages__"
  max_per_file: 50_000

# Other Danish instruction/reference additions.
- prefix: "synquid_danish_verifiable_reasoning__"
  repeat: 20
- prefix: "synquid_ifbench_train__"
  repeat: 10
- prefix: "oliverkinch_multi_wiki_qa_high_quality__"
  repeat: 20
- prefix: "oliverkinch_eur_lex_sum_instruct__"
  repeat: 20
- prefix: "oliverkinch_dst_table_prompts_bt__"
  repeat: 10
- prefix: "oliverkinch_tidsskrift_dk_bt__"
  repeat: 10
- prefix: "oliverkinch_dynaword_bt__"
  repeat: 8
- prefix: "oliverkinch_danish_university_portals_bt__"
  repeat: 10
- prefix: "oliverkinch_danmarks_statistik_bt__"
  repeat: 10
- prefix: "oliverkinch_doab_da_bt__"
  repeat: 10
- prefix: "oliverkinch_eur_lex_bt__"
  repeat: 10

# Safe filtered Sapient content, with source-prefixed names in mixed tokenization.
- prefix: "sapient_cleaned__data_clustered__SYNTH__"
  max_per_file: 20_000
- prefix: "sapient_cleaned__data_clustered__flan__cot_"
- prefix: "sapient_cleaned__data_clustered__flan__"
  max_per_file: 5_000
- prefix: "sapient_cleaned__data_clustered__dmmath__"
