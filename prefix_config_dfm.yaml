- prefix: "sapient_cleaned__data_clustered__ampsmathematica__"
  max_per_file: 10_000
- prefix: "sapient_cleaned__data_clustered__tasksource__"
  max_per_file: 10_000
- prefix: "sapient_cleaned__data_clustered__openmathinstruct2__"
  max_per_file: 2_000_000
- prefix: "sapient_cleaned__data_clustered__acereason__"
