# DFM10 sampling policy.
#
# DFM10 inherits DFM9 and adds train-only Andersen and Alexandra Institute
# sources. Held-out validation/test rows are never tokenized for training.
#
# Changes from DFM9:
#   - Andersen modernization: 1,068 rows
#   - Bornholmsk/standard-Danish translation: 6,785 pairs in both directions
#   - DiEm historical Danish modernization: accepted generated rows only
#   - strictly grounded Nordjylland summaries: final count recorded after audit
#   - Danish ScandiQA: 6,810 rows
#   - selected Danish/English MultiZebra: 768 rows
#   - DaNE: 4,383 rows
#   - DaCoref: 2,686 rows
#   - Z.ai DeepDive: 858 successful native search-agent trajectories
#   - OpenStax Mimir SFT: independently audited grounded academic instruction
#   - expanded Mimir grounded SFT: audited capability-gap instruction at one pass
#   - DSL Danish sentiment and FrameNet lexical supervision: one gold pass

- prefix: dsldk_danish_sentiment_lexicon.jsonl
  repeat: 1
- prefix: dsldk_danish_sentiment_lexicon_natural.jsonl
  repeat: 1
- prefix: dsldk_danish_framenet.jsonl
  repeat: 1
- prefix: dsldk_danish_framenet_natural.jsonl
  repeat: 1

