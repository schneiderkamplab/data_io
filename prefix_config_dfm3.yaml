# DFM3 mix: DFM2 plus selected English Common Pile raw objectives and a larger
# approved English instruction slice.
#
# Raw-objective target:
# - X direct continuation from selected Common Pile sources
# - X prefix continuation
# - X denoising
# - 3X span filling
# Here X is the DFM2 DynaWord direct slice, approximately 2.8B covered
# tokens/epoch. Initial row caps are intentionally conservative; inspect
# data/show_analytics_dfm3.md and tune if the Common Pile token totals miss
# 1+1+1+3.

# DFM3 Common Pile self-supervised English raw-text tasks.
- prefix: "dfm3_common_pile_direct_continuation__"
  max_per_file: 40_000
- prefix: "dfm3_common_pile_prefix_continuation__"
  max_per_file: 40_000
- prefix: "dfm3_common_pile_denoising__"
  max_per_file: 40_000
- prefix: "dfm3_common_pile_span_fill_v1__"
  max_per_file: 40_000
- prefix: "dfm3_common_pile_span_fill_v2__"
  max_per_file: 40_000
- prefix: "dfm3_common_pile_span_fill_v3__"
  max_per_file: 40_000

# DFM2 DynaWord self-supervised raw-text tasks.
- prefix: "dfm2_dynaword_prefix_continuation__"
  max_per_file: 60_000
- prefix: "dfm2_dynaword_prefix_continuation_v2__"
  max_per_file: 60_000
- prefix: "dfm2_dynaword_denoising__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_denoising_v2__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_span_fill_v1__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_span_fill_v2__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_span_fill_v3__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_span_fill_v4__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_span_fill_v5__"
  max_per_file: 30_000
- prefix: "dfm2_dynaword_span_fill_v6__"
  max_per_file: 30_000

