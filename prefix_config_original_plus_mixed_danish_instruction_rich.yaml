# Ordered: First match applies.
#
# Danish-instruction-rich config for original ∪ mixed.
# Starts from the balanced union policy, but reduces raw continuation and
# pure translation volume while increasing Danish instruction/reference-like
# sources such as Synquid, Oliver Kinch instruction/backtranslation/QA,
# LexDK, and DBC.

# Keep balanced raw continuation / pure translation volume
- prefix: "danish_dynaword__"
  max_per_file: 50_000
- prefix: "opus__"
  max_per_file: 200_000
- prefix: "oliverkinch_machine_translation_da_en__"
  max_per_file: 3_000_000
- prefix: "oliverkinch_machine_translation_da_ar__"
  max_per_file: 1_000_000
- prefix: "oliverkinch_machine_translation_da_uk__"
  max_per_file: 1_000_000
- prefix: "synquid_translation_100k__"
  repeat: 1

# More Danish instruction/reference-like content
- prefix: "dbc__dbc-abstracts_"
  max_per_file: 150_000
- prefix: "dbc__dbc-reviews"
  max_per_file: 250_000
- prefix: "dbc__dbc-faktalink"
  repeat: 40
- prefix: "dbc__dbc-farfatterweb"
  repeat: 40
- prefix: "lexdk__"
  repeat: 18
- prefix: "synquid_danish_verifiable_reasoning__"
  repeat: 35
- prefix: "synquid_ifbench_train__"
  repeat: 15
- prefix: "oliverkinch_multi_wiki_qa_high_quality__"
