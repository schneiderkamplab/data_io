# DFM8-post sampling policy.
#
# This config assumes tokenized_path points at data/tokenized_dfm8_post, a
# filtered union built by scripts/build_tokenized_dfm8_post_tree.py. Do not point
# it at full data/tokenized_dfm8 because sample_tokenized.py includes unmatched
# tasks fully by default.
#
# Target shape:
# - 80% behavior-focused post-training data for multi-turn chat, tool calling,
#   instruction following, summarization/rewrite control, and Danish behavior.
# - 20% broadly sampled anchors for math/code/general capability preservation.
# Exact percentages must be checked in data/show_analytics_dfm8_post.md after
# sampling; this sampler works by per-source caps/repeats rather than explicit
# token-budget buckets.

# DFM8 behavior-focused synthetic data.
- prefix: dfm8-synthetic-native-tool-calling__
  repeat: 4
- prefix: dfm8-synthetic-constrained-format-following__
  repeat: 3
- prefix: dfm8-synthetic-multiturn-danish-english-chat__
  repeat: 3
- prefix: dfm8-synthetic-danish-summarization-rewrite-controls__
  repeat: 3

# Audited OpenHermes derivatives.
- prefix: dfm8-openhermes-en__
  repeat: 2
- prefix: dfm8-openhermes-da__
  repeat: 2

# Native tool-use and agentic SFT.
- prefix: dolci_native_tool_use__
