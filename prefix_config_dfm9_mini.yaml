# DFM9-mini sampling policy.
#
# Subset of DFM9 containing ONLY fully permissively licensed datasets.
# Excludes:
#   - Local/agreement-only sources (DBC, LexDK, TV2R, skolegpt, laerebogen,
#     kaenguruen, AI Arena, Nordjylland news)
#   - EU TDM-only sources (Sapient-sourced FLAN/Tasksource/Platypus/math/synth,
#     code_meta_reasoning, natural_instructions, croco_munin, gsm_symbolic_da,
#     webinstruct, arxiv_paper_summarization)
#   - Non-permissive licenses (no_robots CC-BY-NC, OpenHermes mixed provenance,
#     synquid gated/uncertain, dfm_dyna_instruct mixed sources)
#
# Current sample: ~5.689B tokens/epoch, 10 epochs = 56.886B total.

# ── DynaWord transformations (Danish DynaWord, permissive) ──
- prefix: danish-dynaword-denoising__
  repeat: 1
- prefix: danish-dynaword-paragraph-reordering__
  repeat: 1
- prefix: danish-dynaword-prefix-continuation__
  repeat: 1
- prefix: danish-dynaword-span-filling__
  repeat: 1

# ── Common Pile transformations (public domain / CC-BY-SA) ──
- prefix: common-pile-denoising__
  max_per_file: 20000
- prefix: common-pile-paragraph-reordering__
  max_per_file: 20000
- prefix: common-pile-prefix-continuation__
  max_per_file: 20000
- prefix: common-pile-span-filling__
  max_per_file: 20000

# ── Cross-lingual transformations (synthetic, DynaWord/Common Pile seed) ──
- prefix: transformations-danish-danish__
  max_per_file: 100
- prefix: transformations-danish-english__
  max_per_file: 100
- prefix: transformations-english-danish__
  max_per_file: 100
- prefix: transformations-english-english__
  max_per_file: 100

