# DFM6 sampling policy.
#
# Policy: DFM6 inherits DFM5 caps/repeats for every shared source prefix unless
# this file explicitly overrides that prefix for a deliberate DFM6 upscale.
# The first matching prefix wins in data_io/sample_tokenized.py, so DFM6-specific
# overrides are listed before inherited DFM5 defaults.
#
# Target after the 2026-06-20 rebalance: roughly 56B tokens/epoch split around
# 16B English/general, 24B code/math/tool/reasoning, and 16B Danish-language.
# Broad Sapient FLAN/SYNTH keeps inherited DFM5 caps; upscaling is concentrated
# in selected Danish, code/math/tool, DOLCI/Tulu, Common Pile, and transformation
# sources.

