# DFM8 sampling policy.
#
# DFM8 starts from DFM7 and adds the repaired/audited OpenHermes derivatives
# plus the selected giannor TV2R instruction datasets. It also keeps broad
# DynaWord/Common Pile transform sources visible as separate prefixes.

- prefix: giannor_dala_tv2r_it__
  repeat: 1
- prefix: giannor_gec_dala_tv2r_it__
  repeat: 1
- prefix: dfm8-openhermes-en__
  repeat: 2
- prefix: dfm8-openhermes-da__
  repeat: 2
- prefix: kobprof_skolegpt_instruct__
  repeat: 8

# Broad synthetic/transformation families.
- prefix: danish-dynaword-denoising__
