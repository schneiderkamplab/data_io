# DFM5 mix.
#
# Source intent:
# - current kept Sapient subset at the original Sapient sampling rate
# - selected Danish additions:
#   laerebogen_with_followups, lexdk, opus, oliverkinch_*, synquid*, dbc
# - accepted export datasets from Danish DynaWord, Common Pile, and
#   transformation exports
# - reduced Nemotron SFT target: about 3.1B tokens/epoch
# - DOLCI SFT at the DFM4 rate: about 3.16B tokens/epoch
# - reduced AllenAI/Tulu/reasoning/math/science/no_robots target: about
#   3.1B tokens/epoch
# - DFM4 summarization datasets at the DFM4 rate
#
# This config is intended for data/tokenized_dfm5, built by:
#   python scripts/build_tokenized_dfm5_tree.py --force

# Anonymized synthetic replacements for the high40 subset of DFM5-excluded
# Sapient sources. These are generated rows, kept separate from original
# Sapient prefixes to avoid accidental original-rate sampling.
- prefix: "synth_high40__"
  repeat: 1
- prefix: "synth_repeat30__"
  repeat: 1

# Accepted export tasks. These tokenized roots should be built from audited
# accepted-only rows for audited datasets, and from already accepted transform
# exports for transformation datasets.
- prefix: "danish-dynaword-denoising__"
  repeat: 1
- prefix: "danish-dynaword-paragraph-reordering__"
  repeat: 1
- prefix: "danish-dynaword-prefix-continuation__"
  repeat: 1
- prefix: "danish-dynaword-span-filling__"
  repeat: 1
- prefix: "common-pile-denoising__"
  repeat: 1
- prefix: "common-pile-paragraph-reordering__"
  repeat: 1
- prefix: "common-pile-prefix-continuation__"
  repeat: 1
- prefix: "common-pile-span-filling__"
  repeat: 1
- prefix: "transformations-danish-danish__"
  repeat: 1
- prefix: "transformations-danish-english__"
  repeat: 1
- prefix: "transformations-english-danish__"
  repeat: 1
- prefix: "transformations-english-english__"
  repeat: 1

# DFM4 summarization datasets.
- prefix: "dfm4_arxiv_paper_summarization__"
  max_per_file: 100_000
- prefix: "dfm4_govreport_summarization__"
  repeat: 2
- prefix: "dfm4_wiki_cat_sum_summarization__"
  repeat: 2
- prefix: "dfm4_laion_scientific_summaries__"
  max_per_file: 3_000

# Selected Danish instruction/reference additions.
- prefix: "dbc__dbc-abstracts_"
  max_per_file: 100_000
- prefix: "dbc__dbc-reviews"
  max_per_file: 150_000
- prefix: "dbc__dbc-faktalink"
  repeat: 10
- prefix: "dbc__dbc-farfatterweb"
  repeat: 10

- prefix: "laerebogen_with_followups__"
  repeat: 1

- prefix: "lexdk__"
  repeat: 2

- prefix: "opus__"
  max_per_file: 10_000_000

# User-selected Oliver Kinch and Synquid families. Keep the DFM4 rates for
# continuity unless we later decide to rebalance DFM5 after analytics.
- prefix: "oliverkinch_machine_translation_da_en__"
  max_per_file: 3_000_000
- prefix: "oliverkinch_machine_translation_da_uk__"
  max_per_file: 1_000_000
- prefix: "oliverkinch_machine_translation_da_ar__"
  max_per_file: 1_000_000
- prefix: "oliverkinch_instruct_bt__"
  repeat: 10
- prefix: "oliverkinch_multi_wiki_qa_high_quality__"
  repeat: 10
- prefix: "oliverkinch_eur_lex_sum_instruct__"
  repeat: 10
- prefix: "oliverkinch_dst_table_prompts_bt__"
  repeat: 10
- prefix: "oliverkinch_tidsskrift_dk_bt__"
  repeat: 2
- prefix: "oliverkinch_dynaword_bt__"
  repeat: 2
- prefix: "oliverkinch_danish_university_portals_bt__"
  repeat: 10
- prefix: "oliverkinch_danmarks_statistik_bt__"
  repeat: 10
- prefix: "oliverkinch_doab_da_bt__"
  repeat: 10
- prefix: "oliverkinch_eur_lex_bt__"
  repeat: 10

- prefix: "synquid_wiki_instruct_da__"
  repeat: 2
- prefix: "synquid_mt_da_deepseek__"
  max_per_file: 100_000
- prefix: "synquid_wildchat_100k_qwen_messages__"
  max_per_file: 50_000
- prefix: "synquid_translation_100k__"
  repeat: 1
- prefix: "synquid_danish_verifiable_reasoning__"
  repeat: 2
- prefix: "synquid_ifbench_train__"
  repeat: 10

# Original Sapient sampling policy for original task names. The DFM5 tokenized
# tree only links tasks admitted by config/data/source_filter.yaml, so these
# rules apply to the kept subset.
- prefix: "SYNTH__"
  max_per_file: 20_000
- prefix: "flan__cot_"
- prefix: "flan__"
  max_per_file: 5_000
- prefix: "dmmath__"
  max_per_file: 100_000
- prefix: "ampsmathematica__"
  max_per_file: 10_000
- prefix: "tasksource__"
  max_per_file: 10_000
- prefix: "openmathinstruct2__"
  max_per_file: 2_000_000
- prefix: "acereason__"
  max_per_file: 2_000_000
- prefix: "openthoughts2__"
  max_per_file: 500_000
- prefix: "sudoku_extreme__"
  max_per_file: 1_000_000

# Repeat small HQ Sapient datasets.
- prefix: "Platypus__"
  repeat: 10
- prefix: "omnimath.jsonl"
  repeat: 10
- prefix: "gsm8k_train.jsonl"
  repeat: 10
- prefix: "math_train.jsonl"
  repeat: 10
- prefix: "webinstruct_verified.jsonl"
  repeat: 10
- prefix: "no_robots.jsonl"
  repeat: 10

# Reduced Nemotron SFT. These caps are roughly 44% of the DFM4 caps, targeting
# about 3.1B tokens/epoch instead of DFM4's about 7.0B.
- prefix: "nemotron_multilingual__"
  max_per_file: 22_000
- prefix: "nemotron_swe__"
  max_per_file: 89_000
- prefix: "nemotron_agentic__"
  max_per_file: 355_000
- prefix: "nemotron_instruction_reasoning_off__"
  max_per_file: 888_000

# DOLCI SFT at the DFM4 rate.
- prefix: "dolci_instruct_sft__"
  max_per_file: 2_000_000
- prefix: "dolci_instruct_sft_no_tools__"
  max_per_file: 2_000_000
- prefix: "dolci_instruct_sft_tool_use__"
  max_per_file: 500_000
- prefix: "dolci_instruct_sft_tool_use_sa__"
  max_per_file: 50_000

# Reduced AllenAI/Tulu/reasoning/math/science/no_robots. These caps are
# roughly 57% of the DFM4 caps, targeting about 3.1B tokens/epoch instead of
# DFM4's about 5.43B.
- prefix: "allenai_big_reasoning_traces__"
  max_per_file: 43_000
- prefix: "allenai_if_sft_verified__"
  repeat: 1
- prefix: "allenai_if_multi_constraints_upto5__"
  repeat: 1
- prefix: "allenai_open_math_2_50k_r1__"
  repeat: 1
- prefix: "allenai_sciriff_train_mix__"
  repeat: 1
- prefix: "allenai_verifiable_reasoning_gpt41__"
  max_per_file: 86_000
- prefix: "allenai_verifiable_reasoning_o4mini__"
  max_per_file: 86_000
- prefix: "allenai_code_meta_reasoning__"
  max_per_file: 171_000
- prefix: "allenai_rlvr_ifeval__"
  repeat: 1
- prefix: "allenai_tulu_3_sft_mixture__"
  max_per_file: 1_140_000
- prefix: "allenai_tulu_v2_sft_mixture__"
  max_per_file: 1_140_000
- prefix: "allenai_tulu_v2_sft_long_mixture__"
  max_per_file: 1_140_000
- prefix: "allenai_tulu_3_personas_math__"
  max_per_file: 43_000
- prefix: "allenai_tulu_3_personas_algebra__"
  max_per_file: 29_000
- prefix: "allenai_tulu_3_personas_code__"
  max_per_file: 29_000
- prefix: "allenai_tulu_3_personas_if__"
  max_per_file: 29_000
- prefix: "no_robots__"
  repeat: 5
